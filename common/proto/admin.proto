/**
 * Oxia Coordinator Admin API
 */
syntax = "proto3";

package io.oxia.proto.v1;

option go_package = "github.com/oxia-db/oxia/common/proto";
option java_multiple_files = true;

import "backup.proto";
import "metadata.proto";

service OxiaAdmin {

  rpc ListDataServers(ListDataServersRequest) returns (ListDataServersResponse);
  rpc GetDataServer(GetDataServerRequest) returns (GetDataServerResponse);
  rpc CreateDataServer(CreateDataServerRequest) returns (CreateDataServerResponse);
  rpc PatchDataServer(PatchDataServerRequest) returns (PatchDataServerResponse);
  rpc DeleteDataServer(DeleteDataServerRequest) returns (DeleteDataServerResponse);

  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc PatchNamespace(PatchNamespaceRequest) returns (PatchNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

  /**
   * Triggers a shard split. The specified shard is split into two child
   * shards at the given split point (or midpoint if not specified).
   */
  rpc SplitShard(SplitShardRequest) returns (SplitShardResponse);

  /**
   * Makes the backups of the selected shards due now, e.g. before an
   * upgrade. The backups run in the background, see ListBackups.
   */
  rpc RequestBackup(RequestBackupRequest) returns (RequestBackupResponse);

  /**
   * Lists the backups of a namespace, through a data server.
   */
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);

  /**
   * Restores a namespace as of a point in time into a new namespace, from
   * the newest backup of each part of the hash range at that time. The
   * restore runs in the background: the new namespace serves once its
   * shards have installed their backups and elected their leaders.
   */
  rpc RestoreNamespace(RestoreNamespaceRequest) returns (RestoreNamespaceResponse);
}

message ListDataServersRequest {
}

message ListDataServersResponse {
  repeated DataServerView data_servers = 1;
}

message GetDataServerRequest {
  string data_server = 1;
}

message GetDataServerResponse {
  DataServerView data_server = 1;
}

message DataServerView {
  DataServer data_server = 1;
  DataServerStatus data_server_status = 2;
}

message CreateDataServerRequest {
  DataServer data_server = 1;
}

message CreateDataServerResponse {
  DataServer data_server = 1;
}

message PatchDataServerRequest {
  DataServer data_server = 1;
}

message PatchDataServerResponse {
  DataServer data_server = 1;
}

message DeleteDataServerRequest {
  string data_server = 1;
}

message DeleteDataServerResponse {
  DataServer data_server = 1;
}

message CreateNamespaceRequest {
  Namespace namespace = 1;
}

message CreateNamespaceResponse {
  Namespace namespace = 1;
}

message PatchNamespaceRequest {
  Namespace namespace = 1;
}

message PatchNamespaceResponse {
  Namespace namespace = 1;
}

message DeleteNamespaceRequest {
  string namespace = 1;
}

message DeleteNamespaceResponse {
  Namespace namespace = 1;
}

message ListNamespacesRequest {
}

message ListNamespacesResponse {
  repeated NamespaceView namespaces = 1;
}

message GetNamespaceRequest {
  string namespace = 1;
}

message GetNamespaceResponse {
  NamespaceView namespace = 1;
}

message NamespaceView {
  Namespace namespace = 1;
  NamespaceStatus namespace_status = 2;
}

message SplitShardRequest {
  string namespace = 1;
  int64 shard = 2;
  // Optional: explicit split point. If omitted, split at midpoint.
  optional uint32 split_point = 3;
}

message SplitShardResponse {
  int64 left_child_shard = 1;
  int64 right_child_shard = 2;
}

message RequestBackupRequest {
  // All the namespaces when empty
  string namespace = 1;
  // All the shards of the namespace when absent
  optional int64 shard = 2;
}

message RequestBackupResponse {
  // The shards made due
  uint32 shards = 1;
}

message RestoreNamespaceRequest {
  string source_namespace = 1;
  string target_namespace = 2;
  // The time to restore as of, in milliseconds since the epoch
  int64 as_of_millis = 3;
  // The destination to restore from: the one of the backup policy when
  // empty
  string destination = 4;
}

message RestoreNamespaceResponse {
  repeated RestoredShard shards = 1;
}

message RestoredShard {
  int64 shard = 1;
  HashRange hash_range = 2;
  int64 source_shard = 3;
  string backup_id = 4;
}
